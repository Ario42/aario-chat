name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.ario --project-name ario_chat _tmp_app
          cp -r _tmp_app/android ./android
          rm -rf _tmp_app

      - name: Allow internet access and set app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          sed -i 's|android:label="ario_chat"|android:label="Ario Chat"|' "$MANIFEST"
          grep -n "INTERNET" "$MANIFEST"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ario-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
